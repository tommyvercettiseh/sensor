plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.hes.sensor.SensorPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

// DEV-COMBINED ONLY:
// Compile the sibling ObjectMarker plugin into the test runtime so one RuneLite
// developer client can load both plugins. This branch expects this local layout:
//   C:\Users\Hesse\Desktop\Codex\sensor
//   C:\Users\Hesse\Desktop\Codex\objectmarker
sourceSets {
	test {
		java {
			srcDir '../objectmarker/src/main/java'
		}
	}
}

group = 'com.hes.sensor'
version = '0.1.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass
	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}
